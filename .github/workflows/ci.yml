name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trustcenter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trustcenter?schema=public
      PGDEV_PORT: "5432"
      PGDEV_DB: trustcenter
      AUTH_SECRET: ci-insecure-test-secret
      STORAGE_DRIVER: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Build (type-checks too)
        run: npm run build
      - name: Migrate, harden, seed
        run: |
          npx prisma migrate deploy
          node scripts/apply-immutability.mjs
          node scripts/seed.mjs
      - name: Tests (immutability + Salesforce matching)
        run: npm test

  security:
    name: Product security gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails the build on any critical finding (hardcoded secrets, unsafe SQL,
      # public S3/RDS, missing headers, unrate-limited public POST, high vulns…).
      - name: Security gate
        run: node scripts/security-gate.mjs

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Format check
        run: terraform -chdir=infra fmt -check -recursive
      - name: Init & validate
        run: |
          terraform -chdir=infra init -backend=false
          terraform -chdir=infra validate

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: trust-center:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
